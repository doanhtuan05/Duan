<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: html_head('Quản lý mã giảm giá')}"></head><body class="admin-dashboard admin-coupons d-flex flex-column min-vh-100"><div th:replace="~{fragments/header :: navbar}"></div><main class="dashboard-shell container-fluid flex-grow-1">
<nav class="admin-tabs" aria-label="Điều hướng quản trị"><a th:href="@{/admin/dashboard}" class="admin-tab"><i class="fa-solid fa-chart-line"></i><span>Tổng quan</span></a><a th:href="@{/admin/products}" class="admin-tab"><i class="fa-solid fa-hat-cowboy"></i><span>Sản phẩm</span></a><a th:href="@{/admin/categories}" class="admin-tab"><i class="fa-solid fa-layer-group"></i><span>Danh mục</span></a><a th:href="@{/admin/brands}" class="admin-tab"><i class="fa-regular fa-copyright"></i><span>Thương hiệu</span></a><a th:href="@{/admin/orders}" class="admin-tab"><i class="fa-solid fa-receipt"></i><span>Đơn hàng</span></a><a th:href="@{/admin/customers}" class="admin-tab"><i class="fa-regular fa-user"></i><span>Khách hàng</span></a><a th:href="@{/admin/coupons}" class="admin-tab active" aria-current="page"><i class="fa-solid fa-ticket"></i><span>Mã giảm giá</span></a></nav>
<header class="products-heading"><div><p class="eyebrow mb-2">KHUYẾN MÃI</p><h1>Quản lý mã giảm giá</h1><p class="heading-copy mb-0"><span th:text="${totalItems}">0</span> mã được tìm thấy</p></div><a th:href="@{/admin/coupons/add}" class="add-product-btn"><i class="fa-solid fa-plus"></i> Thêm mã giảm giá mới</a></header>
<div th:if="${successMessage}" class="product-alert success"><i class="fa-solid fa-circle-check"></i><span th:text="${successMessage}"></span></div><div th:if="${errorMessage}" class="product-alert error"><i class="fa-solid fa-triangle-exclamation"></i><span th:text="${errorMessage}"></span></div>
<section class="dashboard-card order-filter-card"><form th:action="@{/admin/coupons}" class="coupon-filters"><div class="filter-search"><i class="fa-solid fa-magnifying-glass"></i><input type="search" name="keyword" th:value="${keyword}" placeholder="Tìm theo mã code..."></div><select name="status"><option value="">Tất cả trạng thái</option><option value="ACTIVE" th:selected="${status=='ACTIVE'}">Đang hoạt động</option><option value="EXPIRED" th:selected="${status=='EXPIRED'}">Hết hạn</option><option value="UPCOMING" th:selected="${status=='UPCOMING'}">Sắp diễn ra</option><option value="EXHAUSTED" th:selected="${status=='EXHAUSTED'}">Hết lượt dùng</option><option value="DISABLED" th:selected="${status=='DISABLED'}">Tạm khóa</option></select><label class="date-filter"><span>Từ ngày</span><input type="date" name="fromDate" th:value="${fromDate}"></label><label class="date-filter"><span>Đến ngày</span><input type="date" name="toDate" th:value="${toDate}"></label><button class="filter-btn"><i class="fa-solid fa-filter"></i> Lọc</button><a th:href="@{/admin/coupons}" class="reset-btn"><i class="fa-solid fa-rotate-left"></i></a></form></section>
<section class="dashboard-card coupon-table-card" th:unless="${#lists.isEmpty(coupons)}"><div class="coupon-table-wrap"><table class="coupon-table"><thead><tr><th>Mã / Tên</th><th>Loại & Giá trị</th><th>Điều kiện</th><th>Thời hạn</th><th>Lượt dùng</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="c:${coupons}" th:with="exhausted=${c.soLuong!=null and c.soLuongDaDung>=c.soLuong},expired=${c.ngayKetThuc!=null and now.isAfter(c.ngayKetThuc)},upcoming=${c.ngayBatDau!=null and now.isBefore(c.ngayBatDau)}"><td data-label="Mã"><span class="coupon-code" th:text="${c.maCode}"></span><strong class="coupon-name" th:text="${c.tenKhuyenMai}"></strong></td><td data-label="Giá trị"><span th:text="${c.loaiGiamGia=='PERCENTAGE'?'Phần trăm':'Cố định'}"></span><strong class="coupon-value" th:text="${c.loaiGiamGia=='PERCENTAGE'?c.giaTriGiam+'%':#numbers.formatDecimal(c.giaTriGiam,0,'COMMA',0,'POINT')+' ₫'}"></strong></td><td data-label="Đơn tối thiểu" th:text="${#numbers.formatDecimal(c.giaTriToiThieu?:0,0,'COMMA',0,'POINT')}+' ₫'"></td><td data-label="Thời hạn"><small th:text="${c.ngayBatDau!=null?'Từ '+#temporals.format(c.ngayBatDau,'dd/MM/yyyy'):'Không giới hạn bắt đầu'}"></small><strong class="coupon-expiry" th:classappend="${c.ngayKetThuc!=null and !expired and c.ngayKetThuc.isBefore(warningDate)}?' expiry-warning'" th:text="${c.ngayKetThuc!=null?'Đến '+#temporals.format(c.ngayKetThuc,'dd/MM/yyyy'):'Không thời hạn'}"></strong></td><td data-label="Lượt dùng"><div class="usage-label"><span th:text="${c.soLuongDaDung?:0}"></span>/<span th:text="${c.soLuong!=null?c.soLuong:'∞'}"></span></div><div class="usage-track"><span th:style="${'width:'+ (c.soLuong!=null and c.soLuong>0?T(java.lang.Math).min(100,(c.soLuongDaDung?:0)*100/c.soLuong):0) +'%'}"></span></div></td><td data-label="Trạng thái"><span class="coupon-status" th:classappend="${exhausted?' coupon-exhausted':(expired?' coupon-expired':(upcoming?' coupon-upcoming':(c.trangThai?' coupon-active':' coupon-disabled')))}" th:text="${exhausted?'Hết lượt':(expired?'Hết hạn':(upcoming?'Sắp diễn ra':(c.trangThai?'Đang hoạt động':'Tạm khóa')))}"></span></td><td data-label="Thao tác"><div class="product-actions"><a th:href="@{/admin/coupons/edit/{id}(id=${c.id})}" class="edit-btn"><i class="fa-solid fa-pen"></i> Sửa</a><a th:href="@{/admin/coupons/delete/{id}(id=${c.id})}" class="delete-btn" onclick="return confirm('Bạn chắc chắn muốn xóa mã giảm giá này?')"><i class="fa-regular fa-trash-can"></i> Xóa</a></div></td></tr></tbody></table></div><nav class="products-pagination" th:if="${totalPages>1}"><a class="page-control" th:each="i:${#numbers.sequence(0,totalPages-1)}" th:classappend="${currentPage==i}?' active'" th:href="@{/admin/coupons(keyword=${keyword},status=${status},fromDate=${fromDate},toDate=${toDate},page=${i})}" th:text="${i+1}"></a></nav></section>
<section class="dashboard-card empty-state orders-empty" th:if="${#lists.isEmpty(coupons)}"><div class="empty-icon"><i class="fa-solid fa-ticket"></i></div><h4>Không tìm thấy mã giảm giá</h4><p>Thử thay đổi bộ lọc hoặc tạo mã mới.</p></section>
</main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
