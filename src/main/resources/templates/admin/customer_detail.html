<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/header :: html_head('Chi tiết khách hàng')}"></head><body class="admin-dashboard admin-customers d-flex flex-column min-vh-100"><div th:replace="~{fragments/header :: navbar}"></div><main class="dashboard-shell container-fluid flex-grow-1">
<nav class="admin-tabs" aria-label="Điều hướng quản trị"><a th:href="@{/admin/dashboard}" class="admin-tab">Tổng quan</a><a th:href="@{/admin/products}" class="admin-tab">Sản phẩm</a><a th:href="@{/admin/categories}" class="admin-tab">Danh mục</a><a th:href="@{/admin/brands}" class="admin-tab">Thương hiệu</a><a th:href="@{/admin/orders}" class="admin-tab">Đơn hàng</a><a th:href="@{/admin/customers}" class="admin-tab active">Khách hàng</a><a th:href="@{/admin/coupons}" class="admin-tab">Mã giảm giá</a></nav>
<a th:href="@{/admin/customers}" class="back-link"><i class="fa-solid fa-arrow-left"></i> Danh sách khách hàng</a><div class="customer-detail-grid"><section class="dashboard-card customer-info-card"><span class="customer-avatar large" th:text="${#strings.isEmpty(customer.hoTen)?'K':#strings.substring(customer.hoTen,0,1)}"></span><h1 th:text="${customer.hoTen}"></h1><span class="account-status" th:classappend="${customer.taiKhoan!=null?' account-'+#strings.toLowerCase(customer.taiKhoan.trangThai):' account-unverified'}" th:text="${customer.taiKhoan!=null?customer.taiKhoan.trangThai:'Chưa xác thực'}"></span><dl><div><dt>Email</dt><dd th:text="${!#strings.isEmpty(customer.email)?customer.email:'Chưa cập nhật'}"></dd></div><div><dt>Số điện thoại</dt><dd th:text="${!#strings.isEmpty(customer.soDienThoai)?customer.soDienThoai:'Chưa cập nhật'}"></dd></div><div><dt>Địa chỉ giao hàng</dt><dd th:text="${!#strings.isEmpty(customer.diaChi)?customer.diaChi:'Chưa cập nhật'}"></dd></div><div><dt>Tổng chi tiêu</dt><dd class="customer-spending" th:text="${#numbers.formatDecimal(totalSpent,0,'COMMA',0,'POINT')}+' ₫'"></dd></div></dl></section>
<section class="dashboard-card customer-orders-card"><div class="card-heading"><div><p class="card-kicker">LỊCH SỬ</p><h3>Đơn hàng đã đặt</h3></div><span class="category-count" th:text="${#lists.size(orders)}+' đơn'"></span></div><div class="detail-order-list" th:unless="${#lists.isEmpty(orders)}"><a th:each="order:${orders}" th:href="@{/admin/orders/{id}(id=${order.id})}" class="detail-order"><span><strong th:text="${'#'+order.id}"></strong><small th:text="${#temporals.format(order.ngayDat,'dd/MM/yyyy HH:mm')}"></small></span><span class="customer-spending" th:text="${#numbers.formatDecimal(order.tongTien,0,'COMMA',0,'POINT')}+' ₫'"></span><i class="fa-solid fa-angle-right"></i></a></div><div class="empty-state compact" th:if="${#lists.isEmpty(orders)}"><h4>Chưa có đơn hàng</h4><p>Khách hàng này chưa phát sinh giao dịch.</p></div></section></div>
</main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
