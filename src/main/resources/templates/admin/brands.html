<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: html_head('Quản lý thương hiệu')}"></head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-5 flex-grow-1">
        <h3 class="fw-bold mb-4"><i class="fa-solid fa-copyright text-primary me-2"></i>Quản lý thương hiệu mũ</h3>

        <!-- Alerts -->
        <div th:if="${successMessage}" class="alert alert-success border-0 rounded-3 shadow-sm py-3 mb-4" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i><span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger border-0 rounded-3 shadow-sm py-3 mb-4" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${errorMessage}"></span>
        </div>

        <div class="row g-4">
            <!-- Left Pane: Brands List & Rename Forms -->
            <div class="col-md-8">
                <div class="glass-card p-4">
                    <h5 class="fw-bold mb-3 text-dark">Danh sách thương hiệu hiện có</h5>
                    
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th style="width: 80px;" class="text-center">Mã ID</th>
                                    <th>Tên thương hiệu</th>
                                    <th class="text-center" style="width: 280px;">Cập nhật / Xóa</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="br : ${brands}">
                                    <td class="text-center fw-bold" th:text="${br.id}"></td>
                                    <td>
                                        <!-- Inline edit form for each brand -->
                                        <form th:action="@{/admin/brands/edit/{id}(id=${br.id})}" method="post" class="d-flex gap-2">
                                            <input type="text" name="tenThuongHieu" class="form-control form-control-sm" th:value="${br.tenThuongHieu}" required>
                                            <button type="submit" class="btn btn-sm btn-outline-success"><i class="fa-solid fa-check"></i> Lưu</button>
                                        </form>
                                    </td>
                                    <td class="text-center">
                                        <a th:href="@{/admin/brands/delete/{id}(id=${br.id})}" 
                                           class="btn btn-sm btn-outline-danger" 
                                           onclick="return confirm('Bạn có chắc chắn muốn xóa thương hiệu này? Tất cả sản phẩm thuộc thương hiệu cần gỡ bỏ.')">
                                            <i class="fa-solid fa-trash-can me-1"></i>Xóa thương hiệu
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Right Pane: Add New Brand -->
            <div class="col-md-4">
                <div class="glass-card p-4">
                    <h5 class="fw-bold mb-3 text-primary"><i class="fa-solid fa-square-plus me-2"></i>Thêm thương hiệu mới</h5>
                    <form th:action="@{/admin/brands/create}" method="post" th:object="${newBrand}">
                        <div class="mb-4">
                            <label for="newBrandName" class="form-label">Tên thương hiệu mới *</label>
                            <input type="text" th:field="*{tenThuongHieu}" id="newBrandName" class="form-control" required placeholder="Ví dụ: MLB, Adidas, Nike...">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2"><i class="fa-solid fa-plus me-2"></i>Thêm thương hiệu</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
