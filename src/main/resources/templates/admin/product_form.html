<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: html_head(${product.id == null} ? 'Thêm sản phẩm mới' : 'Sửa sản phẩm')}"></head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-5 flex-grow-1" style="max-width: 800px;">
        <!-- Breadcrumbs -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Admin</a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/products}">Sản phẩm</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${product.id == null} ? 'Thêm mới' : 'Chỉnh sửa #' + ${product.id}"></li>
            </ol>
        </nav>

        <!-- Product form card -->
        <div class="glass-card p-5">
            <h3 class="fw-bold mb-4 text-dark">
                <i class="fa-solid fa-file-pen text-primary me-2"></i>
                <span th:text="${product.id == null} ? 'Thêm sản phẩm mới' : 'Chỉnh sửa sản phẩm'"></span>
            </h3>

            <!-- Feedback Alerts -->
            <div th:if="${errorMessage}" class="alert alert-danger border-0 rounded-3 shadow-sm py-3 mb-4" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${errorMessage}"></span>
            </div>

            <!-- Form action handles creation / update dynamic endpoints -->
            <form th:action="${product.id == null} ? @{/admin/products/create} : @{/admin/products/edit/{id}(id=${product.id})}" 
                  method="post" enctype="multipart/form-data" th:object="${product}">
                
                <input type="hidden" th:field="*{id}" th:if="${product.id != null}">

                <div class="mb-3">
                    <label for="tenSanPham" class="form-label">Tên sản phẩm *</label>
                    <input type="text" th:field="*{tenSanPham}" id="tenSanPham" class="form-control" required placeholder="Nhập tên mũ thời trang...">
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="danhMuc" class="form-label">Danh mục loại mũ *</label>
                        <select th:field="*{danhMuc}" id="danhMuc" class="form-select" required>
                            <option value="">Chọn danh mục...</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.tenDanhMuc}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="thuongHieu" class="form-label">Thương hiệu *</label>
                        <select th:field="*{thuongHieu}" id="thuongHieu" class="form-select" required>
                            <option value="">Chọn thương hiệu...</option>
                            <option th:each="br : ${brands}" th:value="${br.id}" th:text="${br.tenThuongHieu}"></option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="gia" class="form-label">Giá bán (₫) *</label>
                        <input type="number" th:field="*{gia}" id="gia" class="form-control" required min="0" step="1000" placeholder="Giá bán...">
                    </div>
                    <div class="col-md-6">
                        <label for="soLuong" class="form-label">Số lượng nhập kho *</label>
                        <input type="number" th:field="*{soLuong}" id="soLuong" class="form-control" required min="0" placeholder="Số lượng tồn kho...">
                    </div>
                </div>

                <!-- Product Image Upload Section -->
                <div class="mb-3">
                    <label for="imageFile" class="form-label">Hình ảnh sản phẩm</label>
                    <input type="file" name="imageFile" id="imageFile" class="form-control" accept="image/*">
                    <div class="form-text">Để trống nếu muốn giữ nguyên ảnh hiện tại hoặc sử dụng ảnh mặc định.</div>
                    
                    <!-- Display current image thumbnail if editing -->
                    <div th:if="${product.anhUrl != null}" class="mt-3">
                        <label class="d-block form-label text-muted small">Hình ảnh hiện tại:</label>
                        <img th:src="${product.anhUrl.startsWith('http') ? product.anhUrl : '/uploads/' + product.anhUrl}" 
                             class="rounded-3 border" style="width: 120px; height: 120px; object-fit: cover;" alt="Current Image">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="moTa" class="form-label">Mô tả chi tiết</label>
                    <textarea th:field="*{moTa}" id="moTa" class="form-control" rows="4" placeholder="Viết mô tả chất liệu, kiểu dáng, số đo vòng đầu của mũ..."></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4 py-2"><i class="fa-solid fa-floppy-disk me-2"></i>Lưu lại</button>
                    <a th:href="@{/admin/products}" class="btn btn-outline-secondary px-4 py-2"><i class="fa-solid fa-xmark me-2"></i>Hủy bỏ</a>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
