<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: html_head('Quản lý sản phẩm')}"></head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-5 flex-grow-1">
        <!-- Breadcrumb & Header actions -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0"><i class="fa-solid fa-hat-cowboy text-primary me-2"></i>Quản lý sản phẩm</h3>
            <a th:href="@{/admin/products/create}" class="btn btn-primary"><i class="fa-solid fa-plus me-2"></i>Thêm sản phẩm mới</a>
        </div>

        <!-- Feedback Alerts -->
        <div th:if="${successMessage}" class="alert alert-success border-0 rounded-3 shadow-sm py-3 mb-4" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i><span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger border-0 rounded-3 shadow-sm py-3 mb-4" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${errorMessage}"></span>
        </div>

        <!-- Search Bar -->
        <div class="glass-card p-3 mb-4">
            <form th:action="@{/admin/products}" method="get" class="d-flex gap-2">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm sản phẩm theo tên...">
                <button type="submit" class="btn btn-dark"><i class="fa-solid fa-magnifying-glass me-2"></i>Lọc</button>
                <a th:href="@{/admin/products}" class="btn btn-outline-secondary"><i class="fa-solid fa-rotate-left"></i></a>
            </form>
        </div>

        <!-- Empty Products List -->
        <div th:if="${products.isEmpty()}" class="glass-card p-5 text-center">
            <i class="fa-regular fa-folder-open text-muted mb-3" style="font-size: 4rem;"></i>
            <h4 class="fw-bold">Chưa có sản phẩm nào!</h4>
            <p class="text-muted">Nhấn nút bên trên để bắt đầu thêm sản phẩm thời trang đầu tiên.</p>
        </div>

        <!-- Products Table -->
        <div class="glass-card p-4 table-responsive" th:if="${!products.isEmpty()}">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th class="text-center" style="width: 80px;">Hình ảnh</th>
                        <th>Tên sản phẩm</th>
                        <th>Danh mục</th>
                        <th>Thương hiệu</th>
                        <th class="text-end">Đơn giá</th>
                        <th class="text-center">Số lượng</th>
                        <th class="text-center">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="sp : ${products}">
                        <td class="text-center">
                            <img th:src="${sp.anhUrl != null ? (sp.anhUrl.startsWith('http') ? sp.anhUrl : '/uploads/' + sp.anhUrl) : 'https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=80'}"
                                 class="rounded-3" alt="Product Thumbnail" style="width: 50px; height: 50px; object-fit: cover;">
                        </td>
                        <td class="fw-bold text-dark" th:text="${sp.tenSanPham}"></td>
                        <td th:text="${sp.danhMuc.tenDanhMuc}"></td>
                        <td th:text="${sp.thuongHieu.tenThuongHieu}"></td>
                        <td class="text-end fw-bold text-primary" th:text="${#numbers.formatDecimal(sp.gia, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
                        <td class="text-center">
                            <span th:classappend="${sp.soLuong <= 3} ? 'badge bg-danger' : 'badge bg-light text-dark'" 
                                  th:text="${sp.soLuong} + ' chiếc'"></span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/admin/products/edit/{id}(id=${sp.id})}" class="btn btn-sm btn-outline-warning me-2"><i class="fa-solid fa-pen-to-square"></i> Sửa</a>
                            <a th:href="@{/admin/products/delete/{id}(id=${sp.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?')"><i class="fa-solid fa-trash-can"></i> Xóa</a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Pagination -->
            <nav class="mt-4 d-flex justify-content-center" th:if="${totalPages > 1}">
                <ul class="pagination pagination-sm">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/products(keyword=${keyword},page=${currentPage - 1})}"><i class="fa-solid fa-angle-left"></i></a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i} ? 'active'">
                        <a class="page-link" th:href="@{/admin/products(keyword=${keyword},page=${i})}" th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/products(keyword=${keyword},page=${currentPage + 1})}"><i class="fa-solid fa-angle-right"></i></a>
                    </li>
                </ul>
            </nav>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
