<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: html_head('Quản lý sản phẩm')}"></head>
<body class="admin-dashboard admin-products d-flex flex-column min-vh-100">
<div th:replace="~{fragments/header :: navbar}"></div>
<main class="dashboard-shell container-fluid flex-grow-1">
    <nav class="admin-tabs" aria-label="Điều hướng quản trị">
        <a th:href="@{/admin/dashboard}" class="admin-tab"><i class="fa-solid fa-chart-line"></i><span>Tổng quan</span></a>
        <a th:href="@{/admin/products}" class="admin-tab active" aria-current="page"><i class="fa-solid fa-hat-cowboy"></i><span>Sản phẩm</span></a>
        <a th:href="@{/admin/categories}" class="admin-tab"><i class="fa-solid fa-layer-group"></i><span>Danh mục</span></a>
        <a th:href="@{/admin/brands}" class="admin-tab"><i class="fa-regular fa-copyright"></i><span>Thương hiệu</span></a>
        <a th:href="@{/admin/orders}" class="admin-tab"><i class="fa-solid fa-receipt"></i><span>Đơn hàng</span></a>
        <a th:href="@{/admin/customers}" class="admin-tab"><i class="fa-regular fa-user"></i><span>Khách hàng</span></a>
        <a th:href="@{/admin/coupons}" class="admin-tab"><i class="fa-solid fa-ticket"></i><span>Mã giảm giá</span></a>
    </nav>

    <header class="products-heading">
        <div><p class="eyebrow mb-2">KHO HÀNG</p><h1>Quản lý sản phẩm</h1><p class="heading-copy mb-0"><span th:text="${#numbers.formatInteger(totalItems,0,'COMMA')}">0</span> sản phẩm trong danh mục</p></div>
        <a th:href="@{/admin/products/create}" class="add-product-btn"><i class="fa-solid fa-plus"></i> Thêm sản phẩm mới</a>
    </header>

    <div th:if="${successMessage}" class="product-alert success" role="alert"><i class="fa-solid fa-circle-check"></i><span th:text="${successMessage}"></span></div>
    <div th:if="${errorMessage}" class="product-alert error" role="alert"><i class="fa-solid fa-triangle-exclamation"></i><span th:text="${errorMessage}"></span></div>

    <section class="dashboard-card filter-card">
        <form th:action="@{/admin/products}" method="get" class="product-filters">
            <div class="filter-search"><i class="fa-solid fa-magnifying-glass"></i><input type="search" name="keyword" th:value="${keyword}" placeholder="Tìm theo tên hoặc mô tả..." aria-label="Tìm sản phẩm"></div>
            <select name="categoryId" aria-label="Lọc theo danh mục"><option value="">Tất cả danh mục</option><option th:each="cat:${categories}" th:value="${cat.id}" th:text="${cat.tenDanhMuc}" th:selected="${cat.id==categoryId}"></option></select>
            <select name="brandId" aria-label="Lọc theo thương hiệu"><option value="">Tất cả thương hiệu</option><option th:each="brand:${brands}" th:value="${brand.id}" th:text="${brand.tenThuongHieu}" th:selected="${brand.id==brandId}"></option></select>
            <button type="submit" class="filter-btn" title="Áp dụng bộ lọc"><i class="fa-solid fa-filter"></i><span>Lọc</span></button>
            <a th:href="@{/admin/products}" class="reset-btn" title="Xóa toàn bộ bộ lọc" aria-label="Xóa toàn bộ bộ lọc"><i class="fa-solid fa-rotate-left"></i></a>
        </form>
    </section>

    <section class="dashboard-card products-table-card" th:unless="${#lists.isEmpty(products)}">
        <div class="products-table-wrap">
            <table class="products-table">
                <thead><tr><th>Sản phẩm</th><th>Danh mục</th><th>Thương hiệu</th><th>Đơn giá</th><th>Tồn kho</th><th><span class="visually-hidden">Thao tác</span></th></tr></thead>
                <tbody><tr th:each="sp:${products}">
                    <td data-label="Sản phẩm"><div class="product-identity"><img th:src="${sp.anhUrl!=null and !#strings.isEmpty(sp.anhUrl)?(sp.anhUrl.startsWith('http')?sp.anhUrl:'/uploads/'+sp.anhUrl):'/images/hat-placeholder.svg'}" src="/images/hat-placeholder.svg" th:alt="${'Ảnh '+sp.tenSanPham}" onerror="this.onerror=null;this.src='/images/hat-placeholder.svg'"><div><strong th:text="${sp.tenSanPham}"></strong><small th:text="${'#'+sp.id}"></small></div></div></td>
                    <td data-label="Danh mục" th:text="${sp.danhMuc!=null?sp.danhMuc.tenDanhMuc:'Chưa phân loại'}"></td>
                    <td data-label="Thương hiệu" th:text="${sp.thuongHieu!=null?sp.thuongHieu.tenThuongHieu:'Chưa có'}"></td>
                    <td data-label="Đơn giá" class="product-price" th:text="${#numbers.formatDecimal(sp.gia,0,'COMMA',0,'POINT')}+' ₫'"></td>
                    <td data-label="Tồn kho"><span class="stock-badge" th:classappend="${sp.soLuong<5}?' stock-danger':(${sp.soLuong<10}?' stock-warning':' stock-ok')"><i class="fa-solid fa-circle"></i><span th:text="${#numbers.formatInteger(sp.soLuong,0,'COMMA')}+' chiếc'"></span></span></td>
                    <td data-label="Thao tác"><div class="product-actions"><a th:href="@{/admin/products/edit/{id}(id=${sp.id})}" class="edit-btn" th:aria-label="${'Sửa '+sp.tenSanPham}" title="Sửa sản phẩm"><i class="fa-solid fa-pen"></i><span>Sửa</span></a><a th:href="@{/admin/products/delete/{id}(id=${sp.id})}" class="delete-btn" th:aria-label="${'Xóa '+sp.tenSanPham}" title="Xóa sản phẩm" onclick="return confirm('Bạn chắc chắn muốn xóa sản phẩm này? Hành động này không thể hoàn tác.')"><i class="fa-regular fa-trash-can"></i><span>Xóa</span></a></div></td>
                </tr></tbody>
            </table>
        </div>
        <nav class="products-pagination" th:if="${totalPages>1}" aria-label="Phân trang sản phẩm"><a class="page-control" th:classappend="${currentPage==0}?' disabled'" th:href="@{/admin/products(keyword=${keyword},categoryId=${categoryId},brandId=${brandId},page=${currentPage-1})}" aria-label="Trang trước"><i class="fa-solid fa-angle-left"></i></a><a class="page-control" th:each="i:${#numbers.sequence(0,totalPages-1)}" th:classappend="${currentPage==i}?' active'" th:href="@{/admin/products(keyword=${keyword},categoryId=${categoryId},brandId=${brandId},page=${i})}" th:text="${i+1}" th:aria-current="${currentPage==i}?'page':null"></a><a class="page-control" th:classappend="${currentPage==totalPages-1}?' disabled'" th:href="@{/admin/products(keyword=${keyword},categoryId=${categoryId},brandId=${brandId},page=${currentPage+1})}" aria-label="Trang sau"><i class="fa-solid fa-angle-right"></i></a></nav>
    </section>

    <section class="dashboard-card empty-state products-empty" th:if="${#lists.isEmpty(products)}"><div class="empty-icon"><i class="fa-solid fa-hat-cowboy"></i></div><h4>Không tìm thấy sản phẩm</h4><p>Thử thay đổi bộ lọc hoặc thêm sản phẩm mới vào cửa hàng.</p><a th:href="@{/admin/products}" class="empty-reset">Xóa bộ lọc</a></section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body></html>
