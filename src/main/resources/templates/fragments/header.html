<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="html_head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - HATS.VN Shop Mũ Thời Trang'"></title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Style System -->
    <link th:href="@{/css/index.css}" rel="stylesheet">
</head>

<body>
    <header th:fragment="navbar">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3 sticky-top shadow-sm">
            <div class="container">
                <a class="navbar-brand" th:href="@{/}">

                    <span class="brand-text">HATS.VN</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">

                    <div class="d-flex align-items-center ms-auto">
                        <!-- If admin is logged in -->
                        <div th:if="${session.admin != null}" class="dropdown">
                            <button class="btn btn-outline-dark dropdown-toggle" type="button" id="adminDropdown"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fa-solid fa-user-shield me-2"></i>Admin: <span
                                    th:text="${session.admin.tenDangNhap}"></span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="adminDropdown">
                                <li><a class="dropdown-menu-item dropdown-item" th:href="@{/admin/dashboard}"><i
                                            class="fa-solid fa-chart-line me-2"></i>Dashboard</a></li>
                                <li><a class="dropdown-menu-item dropdown-item" th:href="@{/admin/products}"><i
                                            class="fa-solid fa-hat-cowboy me-2"></i>Quản lý sản phẩm</a></li>
                                <li><a class="dropdown-menu-item dropdown-item" th:href="@{/admin/categories}"><i
                                            class="fa-solid fa-list me-2"></i>Quản lý danh mục</a></li>
                                <li><a class="dropdown-menu-item dropdown-item" th:href="@{/admin/brands}"><i
                                            class="fa-solid fa-copyright me-2"></i>Quản lý thương hiệu</a></li>
                                <li><a class="dropdown-menu-item dropdown-item" th:href="@{/admin/orders}"><i
                                            class="fa-solid fa-receipt me-2"></i>Quản lý đơn hàng</a></li>
                                <li><a class="dropdown-menu-item dropdown-item" th:href="@{/admin/customers}"><i
                                            class="fa-solid fa-users me-2"></i>Quản lý khách hàng</a></li>
                                <li><a class="dropdown-menu-item dropdown-item" th:href="@{/admin/coupons}"><i
                                            class="fa-solid fa-ticket me-2"></i>Quản lý mã giảm giá</a></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li><a class="dropdown-menu-item dropdown-item text-danger" th:href="@{/logout}"><i
                                            class="fa-solid fa-right-from-bracket me-2"></i>Đăng xuất</a></li>
                            </ul>
                        </div>

                        <!-- If user is logged in -->
                        <div th:if="${session.user != null}" class="d-flex align-items-center gap-4">
                            <a th:href="@{/cart}" class="btn btn-outline-primary position-relative p-2 border-0 d-flex align-items-center justify-content-center">
                                <i class="fa-solid fa-cart-shopping fs-5"></i>
                                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartCountBadge" th:text="${cartSize}" style="font-size: 0.7rem; padding: 0.25em 0.5em;">
                                    0
                                </span>
                            </a>
                            <div class="dropdown">
                                <button class="btn btn-primary dropdown-toggle px-3 d-flex align-items-center" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="fa-solid fa-circle-user me-2 fs-5"></i><span th:text="${session.user.hoTen}"></span>
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                                    <li><a class="dropdown-item" th:href="@{/profile}"><i
                                                class="fa-solid fa-id-card me-2"></i>Thông tin cá nhân</a></li>
                                    <li><a class="dropdown-item" th:href="@{/orders}"><i
                                                class="fa-solid fa-clock-rotate-left me-2"></i>Lịch sử đơn hàng</a></li>
                                    <li>
                                        <hr class="dropdown-divider">
                                    </li>
                                    <li><a class="dropdown-item text-danger" th:href="@{/logout}"><i
                                                class="fa-solid fa-right-from-bracket me-2"></i>Đăng xuất</a></li>
                                </ul>
                            </div>
                        </div>

                        <!-- If not logged in -->
                        <div th:if="${session.user == null && session.admin == null}" class="d-flex gap-2">
                            <a th:href="@{/login}" class="btn btn-outline-primary"><i
                                    class="fa-solid fa-right-to-bracket me-2"></i>Đăng nhập</a>
                            <a th:href="@{/register}" class="btn btn-primary"><i
                                    class="fa-solid fa-user-plus me-2"></i>Đăng ký</a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>
</body>

</html>
