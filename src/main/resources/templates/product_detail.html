<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: html_head(${product.tenSanPham})}"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/header :: navbar}"></div>
<main class="container my-5 flex-grow-1">
  <nav class="mb-4"><a th:href="@{/}">Trang chủ</a> / <span th:text="${product.tenSanPham}"></span></nav>
  <div class="row g-5">
    <div class="col-md-6"><div class="glass-card p-3 text-center"><img th:src="${product.anhUrl != null ? (product.anhUrl.startsWith('http') ? product.anhUrl : '/uploads/' + product.anhUrl) : '/images/hat-placeholder.svg'}" class="img-fluid rounded-3" th:alt="${product.tenSanPham}" style="max-height:450px;object-fit:cover;width:100%"></div></div>
    <div class="col-md-6"><div class="glass-card p-5 h-100">
      <div class="d-flex gap-2 mb-3"><span class="badge bg-primary" th:text="${product.danhMuc.tenDanhMuc}"></span><span class="badge bg-secondary" th:text="${product.thuongHieu.tenThuongHieu}"></span></div>
      <h2 class="fw-bold mb-3" th:text="${product.tenSanPham}"></h2>
      <h3 class="text-primary fw-bold mb-4" id="variantPrice" th:text="${#numbers.formatDecimal(product.gia,0,'COMMA',0,'POINT')} + ' ₫'"></h3>
      <p class="text-muted" th:text="${product.moTa}"></p><hr>
      <form th:action="@{/cart/add}" method="post" th:if="${!#lists.isEmpty(variants) or product.soLuong > 0}">
        <input type="hidden" name="productId" th:value="${product.id}">
        <div class="mb-3" th:if="${!#lists.isEmpty(variants)}">
          <label class="form-label fw-bold" for="variantId">Màu sắc / kích cỡ *</label>
          <select class="form-select" name="variantId" id="variantId" required>
            <option value="">Chọn biến thể</option>
            <option th:each="v : ${variants}" th:value="${v.id}" th:data-price="${v.gia}" th:data-stock="${v.soLuong}" th:disabled="${v.soLuong <= 0}" th:text="${v.mauSac + ' / ' + v.kichCo + ' — ' + #numbers.formatDecimal(v.gia,0,'COMMA',0,'POINT') + ' ₫ (' + v.soLuong + ' còn lại)'}"></option>
          </select>
        </div>
        <div class="mb-3"><span class="fw-bold">Tồn kho: </span><span id="stockLabel" th:text="${#lists.isEmpty(variants) ? product.soLuong + ' sản phẩm' : 'Chọn biến thể'}"></span></div>
        <div class="row g-3 align-items-center"><div class="col-auto"><label for="quantity" class="form-label mb-0">Số lượng:</label></div><div class="col-auto"><input type="number" class="form-control" id="quantity" name="quantity" value="1" min="1" th:max="${product.soLuong}" required style="width:90px"></div><div class="col"><button class="btn btn-accent w-100 py-2" type="submit"><i class="fa-solid fa-cart-plus me-2"></i>Thêm vào giỏ</button></div></div>
      </form>
      <button th:if="${#lists.isEmpty(variants) and product.soLuong <= 0}" class="btn btn-secondary w-100" disabled>Hết hàng</button>
    </div></div>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script>
document.getElementById('variantId')?.addEventListener('change', function () {
  const option = this.options[this.selectedIndex], stock = Number(option.dataset.stock || 0), price = Number(option.dataset.price || 0);
  document.getElementById('quantity').max = stock || 1; document.getElementById('quantity').value = 1;
  document.getElementById('stockLabel').textContent = stock + ' sản phẩm';
  document.getElementById('variantPrice').textContent = new Intl.NumberFormat('vi-VN').format(price) + ' ₫';
});
</script>
</body></html>
