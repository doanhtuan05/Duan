<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: html_head('Đăng nhập')}"></head>
<body class="auth-page d-flex flex-column min-vh-100">
<div th:replace="~{fragments/header :: navbar}"></div>
<main class="auth-main container flex-grow-1 d-flex align-items-center justify-content-center">
  <section class="auth-shell"><div class="auth-intro d-none d-lg-flex"><p class="auth-kicker"><i class="fa-solid fa-sparkles"></i> HATS.VN MEMBER</p><h1>Đội mũ đẹp.<br><span>Sống có gu.</span></h1><p>Khám phá những thiết kế mũ hiện đại, chọn đúng phong cách của riêng bạn.</p><div class="auth-orb orb-one"></div><div class="auth-orb orb-two"></div><i class="fa-solid fa-hat-cowboy auth-hat-icon"></i></div>
    <div class="auth-card"><header><div class="auth-icon"><i class="fa-solid fa-right-to-bracket"></i></div><h2>Chào mừng trở lại</h2><p>Đăng nhập để tiếp tục mua sắm cùng HATS.VN</p></header>
      <div th:if="${errorMessage}" class="auth-alert error"><i class="fa-solid fa-triangle-exclamation"></i><span th:text="${errorMessage}"></span></div><div th:if="${successMessage}" class="auth-alert success"><i class="fa-solid fa-circle-check"></i><span th:text="${successMessage}"></span></div>
      <form th:action="@{/login}" method="post" id="loginForm"><input type="hidden" name="redirect" th:value="${redirect}"><label for="username">Tên đăng nhập</label><div class="auth-input"><i class="fa-regular fa-user"></i><input type="text" name="username" id="username" required autocomplete="username" placeholder="Nhập tên tài khoản"></div><label for="password">Mật khẩu</label><div class="auth-input"><i class="fa-solid fa-lock"></i><input type="password" name="password" id="password" required autocomplete="current-password" placeholder="Nhập mật khẩu"><button type="button" class="password-toggle" aria-label="Hiện mật khẩu"><i class="fa-regular fa-eye"></i></button></div><button type="submit" class="auth-submit"><i class="fa-solid fa-right-to-bracket"></i><span>Đăng nhập</span></button></form>
      <p class="auth-switch">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a></p>
    </div>
  </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script>
document.querySelector('.password-toggle')?.addEventListener('click',e=>{const input=document.getElementById('password'),icon=e.currentTarget.querySelector('i'),show=input.type==='password';input.type=show?'text':'password';icon.className=show?'fa-regular fa-eye-slash':'fa-regular fa-eye'});
document.getElementById('loginForm')?.addEventListener('submit',e=>{if(e.currentTarget.checkValidity()){const b=e.currentTarget.querySelector('.auth-submit');b.disabled=true;b.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i><span>Đang đăng nhập...</span>'}});
</script>
</body></html>
