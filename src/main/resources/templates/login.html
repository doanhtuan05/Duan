<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: html_head('Đăng nhập')}"></head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="auth-container w-100">
            <div class="glass-card p-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-dark"><i class="fa-solid fa-right-to-bracket text-primary me-2"></i>Đăng nhập</h3>
                    <p class="text-muted">Chào mừng bạn trở lại với HATS.VN</p>
                </div>

                <!-- Alert Messages -->
                <div th:if="${errorMessage}" class="alert alert-danger border-0 rounded-3 shadow-sm py-3 mb-4" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${errorMessage}"></span>
                </div>
                <div th:if="${successMessage}" class="alert alert-success border-0 rounded-3 shadow-sm py-3 mb-4" role="alert">
                    <i class="fa-solid fa-circle-check me-2"></i><span th:text="${successMessage}"></span>
                </div>

                <form th:action="@{/login}" method="post">
                    <!-- Carry forward redirect URL -->
                    <input type="hidden" name="redirect" th:value="${redirect}">

                    <div class="mb-3">
                        <label for="username" class="form-label">Tên đăng nhập</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" name="username" id="username" class="form-control border-start-0 ps-0" required placeholder="Nhập tên tài khoản...">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" name="password" id="password" class="form-control border-start-0 ps-0" required placeholder="Nhập mật khẩu...">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fs-6 mb-3"><i class="fa-solid fa-right-to-bracket me-2"></i>Đăng nhập</button>
                    
                    <div class="text-center">
                        <span class="text-muted small">Chưa có tài khoản? </span>
                        <a th:href="@{/register}" class="small fw-bold">Đăng ký ngay</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
