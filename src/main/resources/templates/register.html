<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: html_head('Đăng ký tài khoản')}"></head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="auth-container w-100" style="max-width: 540px;">
            <div class="glass-card p-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-dark"><i class="fa-solid fa-user-plus text-primary me-2"></i>Đăng ký</h3>
                    <p class="text-muted">Đăng ký thành viên để nhận nhiều ưu đãi</p>
                </div>

                <!-- Alert Messages -->
                <div th:if="${errorMessage}" class="alert alert-danger border-0 rounded-3 shadow-sm py-3 mb-4" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/register}" method="post">
                    <h6 class="fw-bold text-primary mb-3"><i class="fa-solid fa-key me-2"></i>Thông tin tài khoản</h6>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="username" class="form-label">Tên đăng nhập *</label>
                            <input type="text" name="username" id="username" class="form-control" th:value="${username}" required placeholder="Tên đăng nhập...">
                        </div>
                        <div class="col-md-6">
                            <label for="password" class="form-label">Mật khẩu *</label>
                            <input type="password" name="password" id="password" class="form-control" required placeholder="Mật khẩu...">
                        </div>
                    </div>

                    <h6 class="fw-bold text-primary mb-3"><i class="fa-solid fa-address-card me-2"></i>Thông tin cá nhân</h6>
                    <div class="mb-3">
                        <label for="fullName" class="form-label">Họ và tên *</label>
                        <input type="text" name="fullName" id="fullName" class="form-control" th:value="${fullName}" required placeholder="Họ và tên khách hàng...">
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="phone" class="form-label">Số điện thoại</label>
                            <input type="tel" name="phone" id="phone" class="form-control" th:value="${phone}" placeholder="Số điện thoại...">
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" name="email" id="email" class="form-control" th:value="${email}" placeholder="Địa chỉ email...">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="address" class="form-label">Địa chỉ nhận hàng</label>
                        <textarea name="address" id="address" class="form-control" rows="2" placeholder="Địa chỉ giao hàng mặc định..." th:text="${address}"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fs-6 mb-3"><i class="fa-solid fa-user-plus me-2"></i>Đăng ký thành viên</button>
                    
                    <div class="text-center">
                        <span class="text-muted small">Đã có tài khoản? </span>
                        <a th:href="@{/login}" class="small fw-bold">Đăng nhập</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
