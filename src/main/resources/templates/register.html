<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: html_head('Đăng ký tài khoản')}"></head>
<body class="auth-page d-flex flex-column min-vh-100">
<div th:replace="~{fragments/header :: navbar}"></div>
<main class="auth-main container flex-grow-1 d-flex align-items-center justify-content-center">
  <section class="auth-shell register-shell"><div class="auth-intro d-none d-lg-flex"><p class="auth-kicker"><i class="fa-solid fa-sparkles"></i> HATS.VN MEMBER</p><h1>Tạo phong cách.<br><span>Đội khác biệt.</span></h1><p>Đăng ký thành viên để lưu đơn hàng và nhận ưu đãi dành riêng cho bạn.</p><div class="auth-orb orb-one"></div><div class="auth-orb orb-two"></div><i class="fa-solid fa-hat-cowboy auth-hat-icon"></i></div>
    <div class="auth-card register-card"><header><div class="auth-icon"><i class="fa-solid fa-user-plus"></i></div><h2>Tạo tài khoản</h2><p>Thông tin của bạn được bảo mật tại HATS.VN</p></header>
      <div th:if="${errorMessage}" class="auth-alert error"><i class="fa-solid fa-triangle-exclamation"></i><span th:text="${errorMessage}"></span></div>
      <form th:action="@{/register}" method="post" id="registerForm"><p class="auth-section-label"><i class="fa-solid fa-key"></i> Thông tin tài khoản</p><div class="auth-form-grid"><div><label for="username">Tên đăng nhập *</label><div class="auth-input"><i class="fa-regular fa-user"></i><input type="text" name="username" id="username" th:value="${username}" required autocomplete="username" placeholder="Tên đăng nhập"></div></div><div><label for="password">Mật khẩu *</label><div class="auth-input"><i class="fa-solid fa-lock"></i><input type="password" name="password" id="password" required autocomplete="new-password" placeholder="Mật khẩu"><button type="button" class="password-toggle" aria-label="Hiện mật khẩu"><i class="fa-regular fa-eye"></i></button></div></div></div>
        <p class="auth-section-label"><i class="fa-regular fa-address-card"></i> Thông tin cá nhân</p><label for="fullName">Họ và tên *</label><div class="auth-input"><i class="fa-regular fa-user"></i><input type="text" name="fullName" id="fullName" th:value="${fullName}" required autocomplete="name" placeholder="Họ và tên khách hàng"></div><div class="auth-form-grid"><div><label for="phone">Số điện thoại</label><div class="auth-input"><i class="fa-solid fa-phone"></i><input type="tel" name="phone" id="phone" th:value="${phone}" autocomplete="tel" placeholder="Số điện thoại"></div></div><div><label for="email">Email</label><div class="auth-input"><i class="fa-regular fa-envelope"></i><input type="email" name="email" id="email" th:value="${email}" autocomplete="email" placeholder="Địa chỉ email"></div></div></div><label for="address">Địa chỉ nhận hàng</label><div class="auth-input textarea-input"><i class="fa-solid fa-location-dot"></i><textarea name="address" id="address" rows="2" autocomplete="street-address" placeholder="Địa chỉ giao hàng mặc định..." th:text="${address}"></textarea></div><button type="submit" class="auth-submit"><i class="fa-solid fa-user-plus"></i><span>Đăng ký thành viên</span></button></form>
      <p class="auth-switch">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
    </div>
  </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script>
document.querySelector('.password-toggle')?.addEventListener('click',e=>{const input=document.getElementById('password'),icon=e.currentTarget.querySelector('i'),show=input.type==='password';input.type=show?'text':'password';icon.className=show?'fa-regular fa-eye-slash':'fa-regular fa-eye'});
document.getElementById('registerForm')?.addEventListener('submit',e=>{if(e.currentTarget.checkValidity()){const b=e.currentTarget.querySelector('.auth-submit');b.disabled=true;b.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i><span>Đang tạo tài khoản...</span>'}});
</script>
</body></html>
